name: Go dependency updates

# Replaces Dependabot's gomod updates, which can never succeed here: srspb/ is
# generated by `buf generate` and gitignored, so Dependabot cannot resolve the
# module's own imports. This workflow regenerates first, then bumps the DIRECT
# requirements, runs the race suite, and opens a PR.
#
# The PR is opened with the DEPS_BOT_TOKEN secret (a fine-grained PAT or
# GitHub App token with Contents: read/write and Pull requests: read/write on
# this repository), because a PR opened with GITHUB_TOKEN does not trigger the
# Test workflow. The logic lives in the portable scripts under .github/scripts
# (shared verbatim with the server repo); only the env below and the generate
# step are specific to this repository.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-deps
  cancel-in-progress: false

env:
  # Wails is excluded until Phase 6.9 track UP lands the Wails GA upgrade.
  GO_DEPS_EXCLUDE: github.com/wailsapp/wails/v3
  GO_BUILD_TAGS: purego

jobs:
  preflight:
    name: Require DEPS_BOT_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require DEPS_BOT_TOKEN
        env:
          DEPS_BOT_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
        run: |
          if [ -z "$DEPS_BOT_TOKEN" ]; then
            echo "::error title=DEPS_BOT_TOKEN missing::Create a fine-grained PAT or GitHub App token for this repository with Contents: read/write and Pull requests: read/write, and store it as the Actions secret DEPS_BOT_TOKEN. PRs opened with GITHUB_TOKEN would not run CI."
            exit 1
          fi

  # Runs third-party code (go get, the module's tests), so it holds NO secret.
  update:
    name: Update and test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Fails unless `go` is exactly go.mod's toolchain directive (go1.27.3).
      - name: Assert patched Go toolchain
        run: bash .github/scripts/assert-go-toolchain.sh

      # Same packages as test.yml's backend job: GTK4/WebKitGTK 6.0 headers for
      # the Wails application package, xvfb for internal/hotkeys' X11 tests.
      - name: Install Linux GUI deps
        timeout-minutes: 10
        uses: ./.github/actions/linux-gui-deps
        with:
          xvfb: "true"

      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.47.2

      - name: Generate proto bindings
        run: buf generate

      # main.go has `//go:embed all:frontend/dist`; any file lets the Go
      # packages compile (same placeholder as test.yml).
      - name: Provide embed placeholder for frontend/dist
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>ci</title>' > frontend/dist/index.html

      # Direct requirements only, mirroring Dependabot's default.
      - name: Bump direct Go dependencies
        run: bash .github/scripts/go-deps-update.sh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "No Go dependency updates."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff -- go.mod
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Go vet
        if: steps.diff.outputs.changed == 'true'
        run: go vet -tags "$GO_BUILD_TAGS" ./...

      - name: Go test (race)
        if: steps.diff.outputs.changed == 'true'
        run: xvfb-run -a go test -race -count=1 -tags "$GO_BUILD_TAGS" ./...

      - name: Go build
        if: steps.diff.outputs.changed == 'true'
        run: go build -tags "$GO_BUILD_TAGS" -o ./vcs-client-ci .

      - name: Write PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "Weekly bump of the direct Go requirements (excluding: ${GO_DEPS_EXCLUDE})."
            echo
            echo '```diff'
            git diff -- go.mod
            echo '```'
            echo
            echo "Tested in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > pr-body.md

      - name: Upload updated module files
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: go-deps
          path: |
            go.mod
            go.sum
            pr-body.md
          if-no-files-found: error

  # Holds the token, so it runs NO go command and no code from the update:
  # it only commits the two module files the update job already tested.
  open-pr:
    name: Open PR
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.DEPS_BOT_TOKEN }}

      - name: Skip if a go-deps PR is already open
        id: open
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("deps/go-"))] | length')
          if [ "$n" -gt 0 ]; then
            echo "::notice::An open deps/go-* PR already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download updated module files
        if: steps.open.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: go-deps
          path: .

      - name: Commit, push and open the PR
        if: steps.open.outputs.skip != 'true'
        run: |
          branch="deps/go-$(date -u +%F)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add go.mod go.sum
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(deps): weekly Go dependency update"
          git push origin HEAD
          gh label create go-deps --repo "$GITHUB_REPOSITORY" --force \
            --description "Weekly Go dependency update" --color 0366d6
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --label go-deps \
            --title "chore(deps): weekly Go dependency update ($(date -u +%F))" \
            --body-file pr-body.md
