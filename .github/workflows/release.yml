name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            binary: vcs-client
          - platform: linux-amd64
            runner: ubuntu-latest
            binary: vcs-client
          - platform: windows-amd64
            runner: windows-latest
            binary: vcs-client.exe
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails' own GTK/WebKit dependencies only. internal/hotkeys adds
      # nothing: -tags purego selects gohook's pure-Go X11 backend (see the
      # note at the top of Taskfile.yml).
      - name: Install Linux GUI deps
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libx11-dev

      # srspb/ is gitignored and generated, so a fresh checkout has no Go
      # bindings at all. This has to run BEFORE `wails3 generate bindings`,
      # not merely before the build: that step type-checks the Go packages,
      # so without srspb it fails with "no required module provides package
      # .../srspb". Mirrors the same pair of steps in test.yml, pinned the
      # same way.
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.47.2

      - name: Generate proto bindings
        run: buf generate

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.22

      # -f carries the go build flags into the type-check `wails3 generate
      # bindings` performs; see the note at the top of Taskfile.yml.
      - name: Generate TypeScript bindings
        run: wails3 generate bindings -ts -f "-tags purego" -clean=true

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Routes through build/{darwin,linux,windows}/Taskfile.yml, whose
      # BUILD_FLAGS already carry -tags purego unconditionally.
      - name: Build app
        run: wails3 task build

      # A cgo-less build succeeds and runs -- it just has no capture, no
      # playback, no noise suppression and no codec, because every one of
      # those is behind `//go:build cgo`. That failure is invisible in a
      # green build, so assert it here rather than trust the Taskfile
      # default to have been picked up. `go version -m` reads the build
      # settings recorded in the binary itself.
      - name: Assert the binary was built with cgo
        shell: bash
        run: |
          settings=$(go version -m "bin/${{ matrix.binary }}")
          echo "$settings" | grep -E "build\s+CGO_ENABLED=" || {
            echo "::error::no CGO_ENABLED build setting recorded in bin/${{ matrix.binary }}"
            exit 1
          }
          echo "$settings" | grep -qE "build\s+CGO_ENABLED=1" || {
            echo "::error::bin/${{ matrix.binary }} was built with CGO_ENABLED=0 -- it has no audio and no voice codec"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vcs-client-${{ matrix.platform }}
          path: bin/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Draft Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Rename per-platform binaries
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            for file in "$dir"*; do
              ext="${file##*.}"
              if [ "$ext" = "exe" ]; then
                cp "$file" "release/${name}.exe"
              else
                cp "$file" "release/${name}"
              fi
            done
          done
          ls -la release/

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release/*
          generate_release_notes: true
