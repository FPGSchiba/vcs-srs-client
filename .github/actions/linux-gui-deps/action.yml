name: Linux GUI deps
description: >
  Installs the GTK4 / WebKitGTK 6.0 / libsoup3 / X11 dev headers Wails' cgo
  links against (and optionally xvfb) with a retried, per-attempt time-capped
  apt-get, so a slow or hanging Ubuntu mirror fails fast instead of holding a
  runner. Composite steps cannot carry timeout-minutes: every CALLING step
  must set `timeout-minutes: 10`.

# No apt cache: awalsh128's apt-package cache action was tried and removed
# (2026-10-27). On GitHub runners it never refreshes the package lists, so a
# stale runner-image list made its install 404 while still exiting 0, it saved
# an empty cache, and every "hit" restored 0 packages.

inputs:
  xvfb:
    description: Also install xvfb, for tests run under xvfb-run.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install with apt-get
      shell: bash
      env:
        XVFB: ${{ inputs.xvfb }}
      run: |
        pkgs="libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libx11-dev"
        if [ "$XVFB" = "true" ]; then
          pkgs="$pkgs xvfb"
        fi
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        for attempt in 1 2 3; do
          echo "apt-get attempt ${attempt}/3"
          # shellcheck disable=SC2086 # pkgs is a space-separated list
          if sudo timeout 120 apt-get "${apt_opts[@]}" update &&
            sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get "${apt_opts[@]}" install -y $pkgs; then
            exit 0
          fi
          sleep 10
        done
        echo "::error title=Linux GUI deps::apt-get install failed after 3 attempts"
        exit 1

    - name: Verify GUI deps
      shell: bash
      env:
        XVFB: ${{ inputs.xvfb }}
      run: bash "$GITHUB_ACTION_PATH/verify.sh"
